libs = []
notes = "One dune project in one directory: dune-project, dune ((executable (name main))), main.ml and m0000.ml... per module, no .mli (so every item is visible, OCaml's default). Item is a record, Shape a variant matched with match; main folds over a literal list of M0000.entry values. The langs/ocaml.toml build/clean/run apply unchanged (dune --profile release, --cache disabled, parallel by default). The release profile compiles without -opaque, so ocamlopt of module i waits for the .cmx of module i-1 (cross-module inlining) and the import chain makes the native compile serial; a dev-profile build (-opaque) of M=200 took about 6.4 s against about 14.5 s in release on a loaded machine. The generated code builds warning-free in the dev profile."
