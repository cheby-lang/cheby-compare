notes = "One console project named main (the standard main.csproj), Program.cs with top-level statements plus one internal static class M0000..M<M-1> per file. Each module nests a sealed record Item and an abstract record Shape with four sealed derived records, matched by a switch expression with a throwing discard arm (C# has no exhaustiveness check over a record hierarchy). Base and Entry are internal, the rest private. Main folds over a Func<long, long>[] collection expression of method groups. Built with langs/csharp.toml's cold dotnet publish (no build servers, no shared compilation); csc compiles the files with its default parallelism."
