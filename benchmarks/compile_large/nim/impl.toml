libs = []
notes = "main.nim plus one module per index (m0000.nim ...) side by side; module i imports m<i-1>. Only base* and entry* are exported. Item is an object, Shape an object variant (case object on a ShapeKind enum) matched with case. Default langs/nim.toml build: nim c -d:release with the default --parallelBuild:0 (one clang per core); clean keeps the compiled std modules in the per-project nimcache (@p* files, after an untimed warm-up build when the project changed) and removes the project's own (@m* files, main.json, the executable), so Nim regenerates the C of every module and recompiles and links only the project's modules."
