notes = "One directory: main.kk and m0000.kk ... per module, `struct item` and `type shape`, built by the language's `build` (one `koka -O2` over main.kk, which compiles the imported modules and their C with parallel clang jobs). Names follow Koka's style (`make-item`, `step1`; `step-1` is not an identifier). Module i also sees module i-1's `base`, so step1 calls its own as `m<i>/base`. Bench (M = 200) does not build: Koka's generated C header for each module #includes the header of every module it imports, so the import chain m0199 -> m0198 -> ... -> m0000 nests 200 headers deep in m0199.c, and Apple clang stops at its fixed include-depth limit of 200 (\"#include nested too deeply\"; Apple clang 21 has no flag to raise it). M = 199 builds and prints the right checksum (388947, same as the Python reference), cold build about 22 s wall, 112 s CPU on a busy machine."
known_failure = "bench: build fails, Apple clang include-depth limit of 200 (Koka headers nest one level per imported module)"
