notes = "One ES module per file (mNNNN.ts), module i does `import * as m<i-1>`. Item is an interface, Shape a discriminated union on `kind`, matched with switch; integer division is Math.trunc(a / k). The generated tsconfig loads the shared @types/node through typeRoots (a path relative from the generated project to build/typescript/node_modules/@types), like hello_world and every other TypeScript implementation, so compile-speed numbers share one declaration-input baseline even though the generated code uses no Node API. No incremental/composite; the langs/typescript.toml build and clean apply unchanged (one cold tsc 7 run, parallel by default). Generated code is Prettier-clean."
