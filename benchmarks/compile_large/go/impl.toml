notes = "One package per module (m0000/m0000.go) in one module named main; module i imports \"main/m<i-1>\". Only Base and Entry are exported. Shape is a sealed interface (unexported isShape marker method, one per variant) with four structs, matched with a type switch. Built with plain `go build` (parallel by default); clean keeps only the std packages compiled in GOCACHE (langs/go.toml), so every generated package is compiled again. Serial by project shape: go build compiles one package at a time in dependency order, and the SPEC's import chain (package i imports only package i-1) leaves no two packages of the project ready at the same time, so the default package parallelism (-p) does nothing here; a review measured the M=200 build at 3.20 s with the default -p and 3.21 s with -p 1 (loaded machine). Read this row as serial because of the project's dependency chain, not because of the build command."
