notes = "Files.readString, String.split(\"\\\\s+\") skipping empty parts, scala.collection.mutable.HashMap[String, Int] with getOrElse and update, Array.sortWith comparing words with < (ordinal String.compareTo). The regex split matches Java and is one of the two forms the SPEC allows; it builds the whole Array[String] first and costs more CPU than the index loop, so part of any JVM-vs-CLR gap here is the splitter (C# splits on chars, not a regex)."
