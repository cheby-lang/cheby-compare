notes = "Files.readString, String.split(\"\\\\s+\") (skipping empty parts), HashMap<String, Integer> with merge, List.sort with a comparator using String.compareTo (ordinal). The regex split was chosen over the index loop with substring that the SPEC also allows; it builds the whole String[] first and, in a review measurement, cost roughly 2x the CPU of the index loop, so part of any JVM-vs-CLR gap here is the splitter (C# splits on chars, not a regex)."
