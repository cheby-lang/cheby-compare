notes = "File read as Data into [UInt8]; split(whereSeparator:) on space and newline (builds the array of all word slices first, which the SPEC allows; this costs about 1 GB peak RSS at bench size); [String: Int] with the default hasher and subscript(_:default:); sorted(by:) with a String < comparator (Swift compares Strings by Unicode canonical ordering, which equals byte order for this ASCII input). The work is in a function: the same code as top-level main.swift code on globals ran about 7x slower."
