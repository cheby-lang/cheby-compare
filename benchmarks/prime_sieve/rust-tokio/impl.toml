libs = ["tokio"]
notes = "#[tokio::main] (multi-thread runtime, default worker count). The generator and every filter are tokio::spawn tasks; channels are tokio::sync::mpsc::channel(1), since tokio's mpsc has no capacity 0. Shutdown is option 2: main returns without awaiting its tasks, and dropping the runtime drops them all at once. With capacity 1 each stage can run one value ahead of its consumer before the shutdown, so this row does a few percent more filter work than the SPEC's counts (the Python row, also capacity 1 with option 2, measured +5.8% filter receives at bench). The driver loop (receive each prime, spawn its filter) is the #[tokio::main] future, which runs through block_on on the main OS thread, not on a worker, as the SPEC row allows: each prime crosses from a worker to the main thread, and each filter spawn goes through the runtime's global inject queue."
