libs = ["org.clojure/core.async 1.9.865"]
notes = "One go-loop per stage (generator and filters) with the parking >! and <! on unbuffered (chan)s; the JVM main thread receives the primes with <!!, as the main platform thread does in the clojure row. Go blocks run as IOC state machines on core.async 1.9's default :mixed executor (an unbounded daemon cached thread pool, threads async-mixed-N; every parked handoff resumes via a Runnable submitted to it); no executor-factory or pool-size property set. Shutdown option 1: that pool's threads are daemons, so returning from -main ends the JVM with the stages still parked. The library is AOT-compiled once by setup/clojure-coreasync.sh (CLJ_AOT_LIBS)."
