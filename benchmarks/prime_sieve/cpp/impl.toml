notes = "One detached std::thread per stage. Rendezvous channel from std::mutex and two std::condition_variables: send fills the slot, signals, then waits until a receiver has taken it (ticket counter); both sides signal after unlocking. Channels are std::shared_ptr held by the threads that use them; shutdown is option 1 (return from main with the threads blocked). The row (about 1.9 s at bench, about 3.4x Rust) pays for blocking condition variables: libc++ on macOS waits through pthread psynch and sleeps in the kernel at once, while Rust's std zero-capacity channel spins briefly before it parks. Notifying under the lock or with notify_one made no measurable difference."
