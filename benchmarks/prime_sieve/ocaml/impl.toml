notes = "One systhread per stage (Thread.create, threads.posix), synchronous Event channels (rendezvous) between stages; the main thread receives the primes. Shutdown is option 1: print, then exit 0 with the stages still blocked, never joined. Expected to be the slowest OS-thread row (5-7 s at bench; a 5-run median of 7.06 s, a single verify run 5.1 s): OCaml 5 systhreads of one domain share that domain's runtime lock, so every handoff between the 802 threads is also a runtime-lock handover. A Mutex + Condition channel of the C++ shape still took about 5 s, so Event adds about 1.4x and the lock is most of the cost."
