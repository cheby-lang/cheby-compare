notes = "The SPEC's Koka row says n/a (\"no tasks or channels\"), but std/async ships with the installed Koka (as in ping_pong), so this follows the SPEC with it. Strands of `firstof` inside `async`; channels are std/async `channel()`, `emit` and `receive`. `emit` never blocks, so the stages use the SPEC's pull protocol: each stage owns a request channel, and a request carries the requester's reply channel, created once. std/async has no dynamic spawn (`interleaved`/`firstof` take their strands up front), so each filter is started by a nested `firstof(filter, rest of the sieve)`, and shutdown is option 2: each `firstof` cancels its filter as the sieve returns. Every await is forwarded through all enclosing interleavings (std/async `emit-on-await`) and the root keeps its pending awaits in a list, so one handoff costs O(pipeline depth): about 70 s at bench (n = 800), against 0.6 s at n = 200. Single-threaded, cooperative."
comparable = false
comparable_note = "Koka: cooperative single-threaded std/async (no dynamic spawn); measured but not comparable, and left out of the geometric means"
