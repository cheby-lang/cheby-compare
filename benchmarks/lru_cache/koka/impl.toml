notes = "Shape C: Koka 3.2's std has no map, so both maps (entries: key -> (value, tick), by_tick: tick -> key) are a hand-written persistent red-black tree over int keys, updated in place when unique (FBIP). Insert is the zipper insert of Koka's samples/basic/rbtree-fbip.kk; delete is Kahrs' (2001) algorithm; the evict takes by_tick's minimum. The loop is one tail-recursive function. The trees are generic, so the entries tree boxes its `value struct entry(value, tick)`, one small allocation per insert; packing value and tick into one int (a scratch test only) gained under 5% at bench, so the code keeps the generic tree rather than a second, monomorphic copy of it. Shape B (a mutable vector hash table and an index-linked list in local vars) is also allowed but is not what a fluent Koka programmer reaches for first."
