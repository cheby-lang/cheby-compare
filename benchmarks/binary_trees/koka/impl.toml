notes = "type tree { Empty; Node(left, right) }, one heap node per Node, freed by Perceus reference counting. Loops are tail-recursive functions. Nodes come from Koka's bundled mimalloc, its default allocator (Rust, C++ and Swift use the macOS libmalloc), and check frees each node as it walks it (Perceus) instead of in a separate destructor pass; both explain why Koka is ahead of Rust and C++ here."
