notes = "new(Node) from the default context.allocator (libc heap), one allocation per node, freed recursively after each check. No arena. On Unix the default heap allocator wraps calloc and adds an alignment header to every request (alignment - 1 + size_of(rawptr) bytes), so each 16-byte node becomes a zeroed allocation of about 32 bytes; this explains the RSS and time gap to Rust and C++."
