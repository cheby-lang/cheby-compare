notes = "A(i, j) is written out in row_sum and column_sum instead of in an `entry(i, j) -> Float` helper. The helper is the more idiomatic shape, but a Float returned from a function is boxed (D-453), and the helper version measured about 1.65x slower at n = 1000 (2.04-2.13 s against 1.25-1.27 s), which would take the bench size (n = 5500) from about 60 s to about 100 s of user time, against the 300 s timeout. fmt form checked by hand: `cheby fmt` does not exist before M5. Rerun `cheby fmt` once it lands."
