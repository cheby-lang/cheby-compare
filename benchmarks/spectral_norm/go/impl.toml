notes = "Default build, which the SPEC allows. On arm64 the Go compiler fuses `x*y + z` into FMADDD by default (the Go spec permits fused multiply-add), so `sum += a(i, j) * xj` in timesA and timesAt becomes an fmadd on the loop-carried dependency, whose latency is longer than a plain fadd. Like the cpp row (clang's default -ffp-contract=on), this explains most of the gap to Rust and Zig, which emit separate fmul and fadd: about 1.3 s against about 0.85 s at the bench size. Writing `float64(a(i, j) * xj)` would stop the fusion, but the code is kept in its plain, default-contraction form because the SPEC does not require non-fused arithmetic here (unlike mandelbrot)."
