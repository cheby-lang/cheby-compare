notes = "The loops are top-level tail-recursive functions, not the local `fn` loops the Cheby guide usually recommends: the current JIT boxes a Float on every local-function call (D-453), and a local-loop version measured 14.4 s at the bench size against 3.3 s. `cr` is computed inline in `walk` and the three totals are accumulator arguments, as in Erlang and Elixir: an earlier version with a `coordinate` helper (a non-tail call returning a Float, which the JIT boxes) and a new `Totals` record per point was about 15% slower. The result of float::from_int still costs 1 boxed Float per point. No `test` blocks, so the line count compares with the other implementations. fmt form checked by hand: `cheby fmt` does not exist before M5. Rerun `cheby fmt` once it lands."
