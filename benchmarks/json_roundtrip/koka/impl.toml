libs = []
notes = "Koka has no JSON library: hand-written recursive-descent parser over a std sslice (next per character) into an ordered value tree (objects as key lists). Numbers follow the full JSON grammar: one without a fraction or exponent is an arbitrary-precision int (all of the data), any other is read from its text with std parse-float64 into a JFloat and written back with std show (plus \".0\" when that shows no fraction), as a library would, and a serializer that conses string pieces in reverse and joins them once (reverse-join). Output records are new JObj values that share the parsed tags, address and history values, whose key order the tree keeps. output_bytes is `out.bytes.length`: std `string/bytes` is the string's own UTF-8 buffer in the C backend (`#1.bytes`, no copy), so it is an O(1) byte length."
