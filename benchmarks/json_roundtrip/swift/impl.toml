notes = "Foundation JSONDecoder into Decodable structs for parsing (no third-party library). Output by a small hand-written compact serializer (a JSONWritable protocol, objects written field by field in the SPEC's key order, strings escaped only when needed), as the SPEC allows: Swift 6.4's JSONEncoder writes keys in a different order on every run, and .sortedKeys would give alphabetical order. At bench size about 2.8 s of 3.3 s is JSONDecoder, about 0.35 s the serializer."
