libs = ["eio 1.6", "eio_main 1.6"]
notes = "Eio_main.run (one domain). One Switch.run per batch, one Fiber.fork_promise ~sw per index, then Promise.await_exn on each promise and the results summed. Eio starts a forked fiber at once, inside the fork call, so each task first does `Fiber.yield ()`: that suspends it on the run queue and returns to the spawner, and its work runs only after the spawn, when the first await suspends the spawner. A batch therefore holds all 1,000 of its tasks suspended before the first join, and the row measures deferred scheduling (queueing and resuming a suspended task), like TypeScript's `await Promise.resolve()` and the other rows. Without the yield each task would finish inside its fork and every await would find its promise already resolved; the yield roughly doubles the time (0.03 s to 0.065 s at n=100000)."
