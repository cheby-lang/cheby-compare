libs = ["gleam_erlang"]
notes = "main calls process.trap_exits(False) first, as Gleam's own main@@main:run wrapper does: the erl -eval process the run command uses traps exits, so each linked task's normal exit would otherwise queue an 'EXIT' message that every later receive scans past (quadratic; 19-35 s instead of ~0.2 s at bench)."
