libs = ["org.clojure/core.async 1.9.865"]
notes = "One (go (work i)) per index, a batch started with mapv so every go block starts before the first take; joined with (<!! ch) on each go block's result channel, summed with reduce. Go blocks run as IOC state machines on core.async 1.9's default :mixed executor (an unbounded daemon cached thread pool, threads async-mixed-N; every parked handoff resumes via a Runnable submitted to it); no executor-factory or pool-size property set. The pool's threads are daemons, so no shutdown call is needed. The library is AOT-compiled once by setup/clojure-coreasync.sh (CLJ_AOT_LIBS)."
