notes = "Swift's async main (top-level code on the main actor) is task A; task B is a `Task { }` created from it, which inherits the main actor, so both run cooperatively on the main actor's executor (no Task.detached). Channels: one AsyncStream<Int> per direction (AsyncStream.makeStream, unbounded; the protocol keeps at most one message in flight). B is joined with `await b.value`. The bench run takes about 2.6-4 s, mostly sys time: every hop goes through the main actor's executor (the dispatch main queue), which wakes the kernel; next(isolation: #isolation) gives the same time, while isolating A and B to one custom actor or the global pool would take about 0.8 s but departs from the SPEC's layout."
