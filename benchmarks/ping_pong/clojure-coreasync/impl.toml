libs = ["org.clojure/core.async 1.9.865"]
notes = "A and B are go blocks using the parking >! and <! on two unbuffered (chan)s; main takes A's result channel (the sum) and then B's with <!!, once each. Go blocks run as IOC state machines on core.async 1.9's default :mixed executor (an unbounded daemon cached thread pool, threads async-mixed-N; every parked handoff resumes via a Runnable submitted to it); no executor-factory or pool-size property set; no virtual threads. The library is AOT-compiled once by setup/clojure-coreasync.sh (CLJ_AOT_LIBS), so the build compiles only main."
