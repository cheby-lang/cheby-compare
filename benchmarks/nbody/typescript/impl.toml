notes = "Bodies are plain objects typed by an interface, mutated in place in an array. A class with parameter properties was about 6x slower: tsc's ES2022 target emits class field declarations ([[Define]] semantics, useDefineForClassFields defaults to true), V8 initializes the fields to undefined, and the later float stores then generalize them to tagged fields that box every value. Math.round on |x| with the sign restored gives half away from zero."
