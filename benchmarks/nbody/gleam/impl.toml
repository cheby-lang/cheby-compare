notes = "Bodies are a 7-field record in a list, rebuilt every step: the first body is folded against each later one, then the updated rest recurses (the SPEC recursive shape). sqrt is math:sqrt through @external, since gleam/float square_root is math:pow(x, 0.5) and not guaranteed correctly rounded. Gleam constants cannot hold arithmetic, so SOLAR_MASS is a function computing 4.0 * PI * PI; gleam format drops trailing zeros of the float literals (same binary64). About 50% slower than erlang/main.erl on the same shape, mostly because list.map and list.reverse are remote calls, where Erlang uses a local list comprehension and lists:reverse (the same BEAM cost explains Elixir's gap). The idiomatic gleam/list calls are kept on purpose."
