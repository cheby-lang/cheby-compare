notes = "Immutable struct body (7 float64 fields) in a list, rebuilt every step by matching `Body(x, y, z, vx, vy, vz, m)` and calling the constructor, so Perceus reuses unique records in place. Not the copy-update syntax `b(vx = ...)`: Koka 3.2 compiles it through optional arguments, boxing every float64 field, and allocates a fresh record (in review, 7.9 s at bench against 3.4 s for the constructor and 2.8 s for match-and-rebuild). Pair loop: the first body folded against the rest, then recurse. Default clang FMA contraction (allowed by the SPEC)."
